name: iOS Build CI

# 在面向 main 的 PR 合并前编译 iOS Framework；保留手动触发。
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build iOS Framework with Gradle
        # 验证 Kotlin/Native 编译与 Framework 链接，不生成或签名 IPA。
        run: |
          ./gradlew :composeApp:linkDebugFrameworkIosArm64 --stacktrace --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx2048M -Dfile.encoding=UTF-8" \
            -Pkotlin.daemon.jvmargs=-Xmx4096M

      - name: List iOS Framework files (for debugging)
        run: find . -path "*ComposeApp.framework" -type d
