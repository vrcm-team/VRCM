name: Deploy intro page

# 把 docs/介绍页 发布到 GitHub Pages（https://vrcm-team.github.io/VRCM/）。
# 首次使用前需在仓库 Settings → Pages → Build and deployment 里把 Source 设为 “GitHub Actions”。
on:
  push:
    branches:
      - main
    paths:
      - 'docs/介绍页/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，新的推送会取消还在排队的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/介绍页

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
